services:
  m365-copilot2api:
    build: .
    image: m365-copilot2api:latest
    container_name: m365-copilot2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"
    environment:
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: /run/secrets/m365_admin_password
      M365_CHAT_TIMEOUT_SECONDS: "120"
      M365_IMAGE_TIMEOUT_SECONDS: "150"
      M365_PUBLIC_IDENTITY_POLICY: "${M365_PUBLIC_IDENTITY_POLICY:-false}"
    volumes:
      - ./data:/data
      - ./secrets/m365_admin_password:/run/secrets/m365_admin_password:ro

  image-site:
    build: ./image-site
    image: m365-image-site:latest
    container_name: m365-image-site
    restart: unless-stopped
    depends_on:
      - m365-copilot2api
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      IMAGE_SITE_HOST: 0.0.0.0
      IMAGE_SITE_PORT: "4180"
      IMAGE_SITE_UPSTREAM: http://m365-copilot2api:4141
      IMAGE_SITE_DB: /data/users.db
      IMAGE_SITE_API_KEY: ${IMAGE_SITE_API_KEY:-}
      IMAGE_SITE_SESSION_SECRET: ${IMAGE_SITE_SESSION_SECRET:-}
      IMAGE_SITE_INITIAL_USERNAME: ${IMAGE_SITE_INITIAL_USERNAME:-}
      IMAGE_SITE_INITIAL_PASSWORD: ${IMAGE_SITE_INITIAL_PASSWORD:-}
    volumes:
      - image_site_db:/data

volumes:
  image_site_db:
